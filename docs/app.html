<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kanting - Video Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:["Inter","-apple-system","Segoe UI","Helvetica","Arial","sans-serif"]},colors:{primary:{50:"#eff6ff",100:"#dbeafe",200:"#bfdbfe",300:"#93c5fd",600:"#2563eb",700:"#1d4ed8"}}}}}</script>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-white text-neutral-900 antialiased">
<div class="h-screen flex flex-col overflow-hidden">
  <header id="status" class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0"></header>
  <div class="flex-1 flex overflow-hidden">
    <aside id="library" class="w-64 border-r border-gray-200 bg-white flex flex-col shrink-0"></aside>
    <main id="workspace" class="flex-1 flex flex-col overflow-hidden bg-gray-50"></main>
    <aside class="w-96 border-l border-gray-200 bg-white flex flex-col shrink-0 h-full">
      <div class="p-4 border-b border-gray-200 bg-gray-50"><h2 class="text-sm font-medium text-gray-700 uppercase tracking-wide">Ask &amp; Discover</h2></div>
      <form id="qform" class="p-4 border-b border-gray-200">
        <input id="qinput" type="text" class="w-full bg-white border border-gray-300 rounded px-4 py-3 text-sm focus:outline-none focus:border-gray-900 disabled:opacity-50" />
        <div id="chips" class="mt-3 flex flex-wrap gap-2"></div>
      </form>
      <div id="results" class="flex-1 overflow-y-auto bg-gray-50"></div>
    </aside>
  </div>
</div>
<div id="modal"></div>
<div id="toasts" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>
<script type="module" src="js/ui.js"></script>
</body></html>
